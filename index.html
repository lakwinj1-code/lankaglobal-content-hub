<!doctype html>
<html lang="si" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var patchFetchSetter = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && desc.get && !desc.set && desc.configurable) {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: desc.enumerable,
                get: desc.get,
                set: function () {},
              });
            }
          };
          patchFetchSetter(window);
          patchFetchSetter(Window && Window.prototype);
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              src.indexOf('moz-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg =
              typeof reason === 'string'
                ? reason
                : (reason && (reason.stack || reason.message)) || '';
            if (
              msg.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('moz-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
    <title>LankaGlobal Content Hub — Sri Lanka to Global Screen</title>
